<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gameweek Predictions</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0a0a; --surface:#111; --surface-2:#1a1a1a; --border:#292929; --text:#f0f0f0; --muted:#8a8a8a; --accent:#00e676; --radius:14px; }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; }
    .header { padding:26px 20px 22px; text-align:center; border-bottom:1px solid var(--border); background:rgba(10,10,10,.94); }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin-top:5px; font-family:'Bebas Neue',sans-serif; font-size:34px; font-weight:400; letter-spacing:.04em; }
    .subtitle { color:var(--muted); font-size:13px; margin-top:2px; }
    main { max-width:1200px; margin:0 auto; padding:24px 16px 40px; }
    .board { overflow:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:0 12px 35px rgba(0,0,0,.18); }
    table { min-width:720px; width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid var(--border); border-right:1px solid var(--border); }
    th:last-child, td:last-child { border-right:0; }
    tbody tr:last-child td { border-bottom:0; }
    thead th { height:108px; padding:14px 12px; vertical-align:bottom; background:var(--surface-2); color:var(--text); text-align:center; }
    .player-heading { position:sticky; left:0; z-index:3; min-width:150px; text-align:left; vertical-align:middle; background:var(--surface-2); color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase; }
    .fixture { display:flex; flex-direction:column; gap:5px; font-size:12px; line-height:1.15; font-weight:600; }
    .fixture .versus { color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.08em; }
    tbody tr:hover td { background:#151515; }
    .player { position:sticky; left:0; z-index:2; min-width:150px; padding:16px; background:var(--surface); font-size:14px; font-weight:600; text-align:left; }
    .prediction { min-width:100px; padding:16px 10px; color:var(--accent); font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.06em; text-align:center; }
    .missing { color:#505050; }
    .state { max-width:460px; margin:80px auto; padding:32px 24px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--muted); text-align:center; line-height:1.55; }
    .state .icon { display:block; margin-bottom:12px; font-size:34px; }
    .state h2 { color:var(--text); font-family:'Bebas Neue',sans-serif; font-size:26px; font-weight:400; letter-spacing:.04em; }
    @media (max-width:600px) { .header { padding-top:20px; } h1 { font-size:30px; } main { padding:18px 12px; } .player, .player-heading { min-width:130px; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="eyebrow">Premier League</div>
    <h1>Gameweek Predictions</h1>
    <p class="subtitle" id="subtitle">Loading the current gameweek…</p>
  </header>
  <main id="content" aria-live="polite"></main>
  <script>
    const PREDICTIONS_URL = 'https://epl.sid84kamath.workers.dev/predictions';
    const content = document.getElementById('content');
    const subtitle = document.getElementById('subtitle');

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[character]);
    }

    function showState(icon, heading, message) {
      content.innerHTML = `<section class="state"><span class="icon">${icon}</span><h2>${heading}</h2><p>${message}</p></section>`;
    }

    function renderBoard(data) {
      subtitle.textContent = `Matchweek ${data.matchday} · Predictions are visible after kickoff`;
      const fixtureHeaders = data.matches.map(match => `<th scope="col"><div class="fixture"><span>${escapeHtml(match.homeTeam)}</span><span class="versus">VS</span><span>${escapeHtml(match.awayTeam)}</span></div></th>`).join('');
      const playerRows = data.players.map(player => {
        const cells = data.matches.map(match => {
          const prediction = player.predictions[match.id];
          return `<td class="prediction${prediction ? '' : ' missing'}">${prediction ? `${prediction.homeScore}–${prediction.awayScore}` : '—'}</td>`;
        }).join('');
        return `<tr><th scope="row" class="player">${escapeHtml(player.name)}</th>${cells}</tr>`;
      }).join('');
      content.innerHTML = `<div class="board"><table><thead><tr><th class="player-heading" scope="col">Player</th>${fixtureHeaders}</tr></thead><tbody>${playerRows}</tbody></table></div>`;
    }

    async function loadPredictions() {
      try {
        const response = await fetch(PREDICTIONS_URL);
        const data = await response.json();
        if (!response.ok || data.status === 'error') throw new Error(data.message || 'Could not load predictions');
        if (data.status === 'not_started') {
          subtitle.textContent = 'Predictions unlock when the gameweek starts';
          showState('⏱️', 'Not started yet', 'This page will show everyone’s predictions as soon as the first match of the next gameweek kicks off.');
          return;
        }
        renderBoard(data);
      } catch (error) {
        console.error('Unable to load predictions:', error);
        subtitle.textContent = 'Please try again shortly';
        showState('⚠️', 'Predictions unavailable', 'We could not load the current gameweek predictions. Please refresh the page in a moment.');
      }
    }
    loadPredictions();
  </script>
</body>
</html>
