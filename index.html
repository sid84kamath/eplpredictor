<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPL Predictions</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --surface2:  #1a1a1a;
      --border:    #242424;
      --accent:    #00e676;
      --accent-dim:#00e67622;
      --text:      #f0f0f0;
      --muted:     #666;
      --danger:    #ff4d4d;
      --radius:    14px;
    }

    html { background: var(--bg); }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 120px;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-pl {
      background: #38003c;
      border: 1px solid #6d1a75;
      color: #e8b4f8;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1;
    }

    .user-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 0;
    }

    .round-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
      padding-left: 2px;
    }

    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
      animation: fadeUp 0.3s ease both;
    }

    .match-card:hover { border-color: #333; }
    .match-card.filled { border-color: var(--accent); }
    .match-card.locked {
      border-color: #3a2f12;
      background: linear-gradient(180deg, #14120c 0%, var(--surface) 42%);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .match-card:nth-child(1)  { animation-delay: 0.03s; }
    .match-card:nth-child(2)  { animation-delay: 0.07s; }
    .match-card:nth-child(3)  { animation-delay: 0.11s; }
    .match-card:nth-child(4)  { animation-delay: 0.15s; }
    .match-card:nth-child(5)  { animation-delay: 0.19s; }
    .match-card:nth-child(6)  { animation-delay: 0.23s; }
    .match-card:nth-child(7)  { animation-delay: 0.27s; }
    .match-card:nth-child(8)  { animation-delay: 0.31s; }
    .match-card:nth-child(9)  { animation-delay: 0.35s; }
    .match-card:nth-child(10) { animation-delay: 0.39s; }

    .match-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    .match-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .team-with-crest {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-with-crest.home {
      justify-content: flex-start;
    }

    .team-with-crest.away {
      justify-content: flex-end;
      flex-direction: row-reverse;
    }

    .team-crest {
      width: 28px;
      height: 28px;
      object-fit: contain;
      opacity: 0.9;
      flex-shrink: 0;
    }

    .team {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text);
    }

    .team.home { text-align: left; }
    .team.away { text-align: right; }

    .vs-divider {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      padding: 0 4px;
    }

    .score-row {
      display: grid;
      grid-template-columns: 1fr 32px 1fr;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
    }

    .score-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 10px 4px;
      width: 100%;
      outline: none;
      -moz-appearance: textfield;
      transition: border-color 0.15s, background 0.15s;
    }

    .score-input::-webkit-outer-spin-button,
    .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .score-input:focus {
      border-color: var(--accent);
      background: #0d1f14;
    }

    .score-input::placeholder { color: #333; }
    .score-input:disabled {
      cursor: not-allowed;
      opacity: 0.75;
      color: #b8b8b8;
      background: #151515;
    }

    .score-sep {
      text-align: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      color: var(--border);
    }

    .locked-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 99px;
      background: rgba(244,211,94,0.08);
      border: 1px solid rgba(244,211,94,0.22);
      color: #f4d35e;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .recent-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .recent-team {
      min-width: 0;
    }

    .recent-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .recent-heading.away {
      flex-direction: row-reverse;
      text-align: right;
    }

    .form-chips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .form-chips.away {
      justify-content: flex-end;
    }

    .form-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: #050505;
    }

    .form-chip.win { background: var(--accent); }
    .form-chip.draw { background: #f4d35e; }
    .form-chip.loss { background: var(--danger); color: #fff; }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .recent-list.away {
      align-items: flex-end;
      text-align: right;
    }

    .recent-fixture {
      max-width: 100%;
      font-size: 11px;
      color: #a0a0a0;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-fixture strong {
      color: var(--text);
      font-weight: 700;
    }

    .recent-empty {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
    }

    .recent-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .recent-team {
      min-width: 0;
    }

    .recent-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .recent-heading.away {
      flex-direction: row-reverse;
      text-align: right;
    }

    .form-chips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .form-chips.away {
      justify-content: flex-end;
    }

    .form-chip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: #050505;
    }

    .form-chip.win { background: var(--accent); }
    .form-chip.draw { background: #f4d35e; }
    .form-chip.loss { background: var(--danger); color: #fff; }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .recent-list.away {
      align-items: flex-end;
      text-align: right;
    }

    .recent-fixture {
      max-width: 100%;
      font-size: 11px;
      color: #a0a0a0;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-fixture strong {
      color: var(--text);
      font-weight: 700;
    }

    .recent-empty {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
    }

    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
      gap: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-text {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 50;
    }

    .footer-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .progress-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .progress-count {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }

    .progress-bar-bg {
      height: 3px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .submit-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 14px;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover:not(:disabled) { opacity: 0.9; }
    .submit-btn:active:not(:disabled) { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .submit-btn .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .submit-btn.loading .btn-spinner { display: block; }
    .submit-btn.loading .btn-text { display: none; }

    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      white-space: nowrap;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--accent); color: var(--accent); }
    .toast.error   { border-color: var(--danger); color: var(--danger); }

    .invalid-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
      gap: 12px;
    }

    .invalid-screen h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      color: var(--danger);
      letter-spacing: 0.04em;
    }

    .invalid-screen p { font-size: 14px; color: var(--muted); line-height: 1.6; }

    .confirmed-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      gap: 14px;
      animation: fadeUp 0.4s ease;
    }

    .confirmed-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .confirmed-icon.locked {
      background: rgba(255,77,77,0.1);
      border-color: var(--danger);
    }

    .confirmed-screen h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    .confirmed-screen h2.locked { color: var(--danger); }

    .confirmed-screen p {
      font-size: 14px;
      color: var(--muted);
      max-width: 280px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      .team { font-size: 12px; }
      .score-input { font-size: 24px; }
      .header-title { font-size: 18px; }
      .recent-form { grid-template-columns: 1fr; }
      .recent-heading.away { flex-direction: row; text-align: left; }
      .form-chips.away { justify-content: flex-start; }
      .recent-list.away { align-items: flex-start; text-align: left; }
    }
  </style>
</head>

<body>

  <div class="toast" id="toast"></div>

  <div class="header">
    <div class="header-left">
      <div class="badge-pl">Premier League</div>
      <span class="header-title">Predictions</span>
    </div>
    <div class="user-pill" id="userPill">—</div>
  </div>

  <div class="page" id="mainPage">
    <div class="round-label" id="roundLabel"></div>
    <div id="matches"></div>
  </div>

  <div class="footer-bar" id="footerBar" style="display:none">
    <div class="footer-inner">
      <div class="progress-row">
        <span class="progress-label">Predictions filled</span>
        <span class="progress-count" id="progressCount">0 / 0</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="submitAll()">
        <div class="btn-spinner"></div>
        <span class="btn-text">Lock In Predictions →</span>
      </button>
    </div>
  </div>

<script>
  const API_URL     = "https://epl.sid84kamath.workers.dev/competitions/PL/matches";
  const BACKEND_URL = "https://epl.sid84kamath.workers.dev/submit";

  const params    = new URLSearchParams(window.location.search);
  const userEmail = params.get("email");

  // Safe JSON parse — never throws even if response is HTML
  async function safeJSON(res) {
    try { return await res.json(); }
    catch(e) { return {}; }
  }

  async function fetchJSONWithRetry(url, attempts = 2, delayMs = 800) {
    let lastError;

    for (let attempt = 1; attempt <= attempts; attempt++) {
      try {
        const res = await fetch(url);
        const data = await safeJSON(res);

        if (!res.ok) {
          const message = data.detail || data.error || `HTTP ${res.status}`;
          throw new Error(message);
        }

        return data;
      } catch (error) {
        lastError = error;
        if (attempt < attempts) {
          await new Promise(resolve => setTimeout(resolve, delayMs));
        }
      }
    }

    throw lastError;
  }

  // Invalid link guard
  if (!userEmail) {
    document.querySelector('.header').style.display = 'none';
    document.getElementById('footerBar').style.display = 'none';
    document.getElementById('mainPage').innerHTML = `
      <div class="invalid-screen">
        <div style="font-size:40px">🔒</div>
        <h2>Invalid Link</h2>
        <p>Please use the personal link sent to your email to access predictions.</p>
      </div>`;
  } else {
    document.getElementById('userPill').textContent = userEmail;
    init();
  }

  // Init: check if already submitted, then load matches
  async function init() {
    document.getElementById('matches').innerHTML = `
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <span class="spinner-text">Loading...</span>
      </div>`;

    loadMatches();
  }

  async function loadMatches() {
    const matchesDiv = document.getElementById('matches');
    const roundLabel = document.getElementById('roundLabel');

    matchesDiv.innerHTML = `
      <div class="spinner-wrap">
        <div class="spinner"></div>
        <span class="spinner-text">Fetching fixtures...</span>
      </div>`;

    try {
      const data = await fetchJSONWithRetry(API_URL, 2, 1000);

      if (!data || !Array.isArray(data.matches)) throw new Error('Bad API response');

      const now      = new Date();
      const upcoming = data.matches
        .filter(m => new Date(m.utcDate) > now)
        .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));

      if (upcoming.length === 0) {
        matchesDiv.innerHTML = `
          <div class="empty-state">
            <div class="icon">📅</div>
            <p>No upcoming matches right now.<br>Check back closer to the next gameweek.</p>
          </div>`;
        return;
      }

      const targetMatchday = upcoming[0].matchday;
      const gameweek = targetMatchday == null
        ? upcoming
        : upcoming.filter(m => m.matchday === targetMatchday);

      const predictionState = await fetchExistingPredictions(gameweek);
      window.predictedMatchIds = new Set(predictionState.predictedMatchIds || []);
      window.existingPredictions = predictionState.predictions || {};

      if (gameweek.length > 0 && gameweek.every(m => isMatchLocked(m.id))) {
        showAlreadySubmitted();
        return;
      }

      roundLabel.textContent = `Gameweek ${gameweek[0].matchday} · ${gameweek.length} matches`;
      matchesDiv.innerHTML = '';

      gameweek.forEach(m => {
        const id   = String(m.id);
        const date = new Date(m.utcDate);
        const when = date.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' })
                   + ' · '
                   + date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/London' })
                   + ' BST';

        const card = document.createElement('div');
        card.className       = 'match-card';
        card.dataset.match_id = id;

        const homeRecent = getPastFixturesForTeam(data.matches, m.homeTeam, date);
        const awayRecent = getPastFixturesForTeam(data.matches, m.awayTeam, date);
        const locked = isMatchLocked(id);
        const existingPrediction = window.existingPredictions[id] || {};
        const existingHomePred = locked && existingPrediction.home_pred !== undefined ? existingPrediction.home_pred : '';
        const existingAwayPred = locked && existingPrediction.away_pred !== undefined ? existingPrediction.away_pred : '';

        card.innerHTML = `
          <div class="match-meta">${when}</div>
          <div class="match-teams">
            <div class="team-with-crest home">
              <img src="${m.homeTeam.crest}" alt="${m.homeTeam.name}" class="team-crest" onerror="this.style.display='none'">
              <span class="team home">${m.homeTeam.shortName || m.homeTeam.name}</span>
            </div>
            <span class="vs-divider">vs</span>
            <div class="team-with-crest away">
              <img src="${m.awayTeam.crest}" alt="${m.awayTeam.name}" class="team-crest" onerror="this.style.display='none'">
              <span class="team away">${m.awayTeam.shortName || m.awayTeam.name}</span>
            </div>
          </div>
          <div class="score-row">
            <input class="score-input" type="number" min="0" max="20" placeholder="–"
              id="home-${id}" oninput="onScoreInput(event)" inputmode="numeric"
              value="${existingHomePred}" ${locked ? 'disabled' : ''}>
            <div class="score-sep">:</div>
            <input class="score-input" type="number" min="0" max="20" placeholder="–"
              id="away-${id}" oninput="onScoreInput(event)" inputmode="numeric"
              value="${existingAwayPred}" ${locked ? 'disabled' : ''}>
          </div>
          ${locked ? '<div class="locked-label">🔒 Already predicted</div>' : ''}
          <div class="recent-form">
            ${renderRecentTeam(m.homeTeam, homeRecent, 'home')}
            ${renderRecentTeam(m.awayTeam, awayRecent, 'away')}
          </div>`;

        card.classList.toggle('locked', locked);

        matchesDiv.appendChild(card);
      });

      window.currentMatches = gameweek;
      document.getElementById('footerBar').style.display = 'block';
      updateProgress();

    } catch (err) {
      console.error(err);
      matchesDiv.innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <p>Failed to load fixtures.<br>${err.message || 'Please try again in a moment.'}</p>
        </div>`;
    }
  }

  async function fetchExistingPredictions(gameweek) {
    try {
      const matchIds = gameweek.map(match => String(match.id)).join(',');
      return await fetchJSONWithRetry(
        `${BACKEND_URL}?email=${encodeURIComponent(userEmail)}&check=1&matchIds=${encodeURIComponent(matchIds)}`,
        2,
        800
      );
    } catch(e) {
      console.warn('Prediction check failed — continuing with editable fixtures', e);
      return { predictedMatchIds: [], predictions: {} };
    }
  }

  function isMatchLocked(matchId) {
    return window.predictedMatchIds && window.predictedMatchIds.has(String(matchId));
  }

  function getTeamKey(team) {
    return String(team?.id || team?.name || team?.shortName || '').trim().toLowerCase();
  }

  function isSameTeam(teamA, teamB) {
    const idA = teamA?.id;
    const idB = teamB?.id;
    if (idA != null && idB != null) return String(idA) === String(idB);
    return getTeamKey(teamA) === getTeamKey(teamB);
  }

  function getPastFixturesForTeam(matches, team, beforeDate) {
    return matches
      .filter(match => {
        const isFinished = match.status === 'FINISHED';
        const playedBeforeFixture = match.utcDate && new Date(match.utcDate) < beforeDate;
        const involved = isSameTeam(match.homeTeam, team) || isSameTeam(match.awayTeam, team);
        return isFinished && playedBeforeFixture && involved;
      })
      .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate))
      .slice(0, 5)
      .map(match => formatRecentFixture(match, team));
  }

  function formatRecentFixture(match, team) {
    const isHome = isSameTeam(match.homeTeam, team);
    const opponent = isHome ? match.awayTeam : match.homeTeam;
    const score = match.score?.fullTime || {};
    const teamGoals = isHome ? score.home : score.away;
    const opponentGoals = isHome ? score.away : score.home;
    const result = teamGoals > opponentGoals ? 'W' : teamGoals < opponentGoals ? 'L' : 'D';

    return {
      result,
      venue: isHome ? 'vs' : '@',
      opponent: opponent?.shortName || opponent?.name || 'Opponent',
      score: `${teamGoals}-${opponentGoals}`,
      date: new Date(match.utcDate).toLocaleDateString('en-GB', { day:'numeric', month:'short' })
    };
  }

  function renderRecentTeam(team, fixtures, side) {
    const chips = fixtures.map(fixture => (
      `<span class="form-chip ${getResultClass(fixture.result)}" title="${fixture.result} ${fixture.score} ${fixture.venue} ${escapeHTML(fixture.opponent)}">${fixture.result}</span>`
    )).join('');

    const rows = fixtures.length
      ? fixtures.map(fixture => `
          <div class="recent-fixture">
            <strong>${fixture.result}</strong> ${fixture.score} ${fixture.venue} ${escapeHTML(fixture.opponent)} · ${fixture.date}
          </div>
        `).join('')
      : '<div class="recent-empty">No completed matches yet</div>';

    return `
      <div class="recent-team">
        <div class="recent-heading ${side}">
          <span>${escapeHTML(team.shortName || team.name)} last 5</span>
          <div class="form-chips ${side}">${chips}</div>
        </div>
        <div class="recent-list ${side}">${rows}</div>
      </div>`;
  }

  function getResultClass(result) {
    return result === 'W' ? 'win' : result === 'L' ? 'loss' : 'draw';
  }

  function escapeHTML(value) {
    return String(value || '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));
  }

  function onScoreInput(event) {
    if (event && event.target && event.target.value !== '') {
      focusNextScoreInput(event.target);
    }

    updateProgress();
    (window.currentMatches || []).forEach(m => {
      const id   = String(m.id);
      const card = document.querySelector(`[data-match-id="${id}"]`);
      const h    = document.getElementById(`home-${id}`).value;
      const a    = document.getElementById(`away-${id}`).value;
      if (card && !isMatchLocked(id)) card.classList.toggle('filled', h !== '' && a !== '');
    });
  }

  function focusNextScoreInput(currentInput) {
    const scoreInputs = Array.from(document.querySelectorAll('.score-input'));
    const currentIndex = scoreInputs.indexOf(currentInput);

    if (currentIndex === -1 || currentIndex === scoreInputs.length - 1) {
      return;
    }

    const nextInput = scoreInputs[currentIndex + 1];
    if (nextInput) {
      nextInput.focus();
      nextInput.select();
    }
  }

  function updateProgress() {
    const matches = window.currentMatches || [];
    const editableMatches = matches.filter(m => !isMatchLocked(m.id));
    const total   = editableMatches.length;
    let   filled  = 0;
    editableMatches.forEach(m => {
      const id = String(m.id);
      const h  = document.getElementById(`home-${id}`)?.value;
      const a  = document.getElementById(`away-${id}`)?.value;
      if (h !== '' && a !== '') filled++;
    });
    document.getElementById('progressCount').textContent = `${filled} / ${total}`;
    document.getElementById('progressFill').style.width  = total ? `${(filled/total)*100}%` : '0%';
  }

  async function submitAll() {
    const btn     = document.getElementById('submitBtn');
    const matches = window.currentMatches || [];

    const predictions = matches.filter(m => !isMatchLocked(m.id)).map(m => {
      const id = String(m.id);
      return {
        match_id:  id,
        home_pred: parseInt(document.getElementById(`home-${id}`)?.value),
        away_pred: parseInt(document.getElementById(`away-${id}`)?.value)
      };
    }).filter(p => !isNaN(p.home_pred) && !isNaN(p.away_pred));

    if (predictions.length === 0) {
      showToast('Enter at least one prediction', 'error');
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');

    try {
      const res = await fetch(BACKEND_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          email: userEmail,
          predictions: predictions
        })
      });
      const result = await safeJSON(res);

      if (result.status === 'duplicate') {
        lockDuplicateMatches(result.duplicateMatchIds || []);
        showToast('Some matches were already predicted — refresh and try again', 'error');
        btn.disabled = false;
        btn.classList.remove('loading');
        return;
      }

      if (result.status !== 'ok') {
        throw new Error(result.message || 'Submission failed');
      }

      document.getElementById('footerBar').style.display = 'none';
      document.getElementById('mainPage').innerHTML = `
        <div class="confirmed-screen">
          <div class="confirmed-icon">✓</div>
          <h2>You're Locked In</h2>
          <p>Your ${predictions.length} prediction${predictions.length !== 1 ? 's' : ''} have been saved. Results will land in your inbox after the gameweek.</p>
        </div>`;

    } catch (err) {
      console.error(err);
      showToast('Submission failed — try again', 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  function showAlreadySubmitted() {
    document.getElementById('footerBar').style.display = 'none';
    document.getElementById('mainPage').innerHTML = `
      <div class="confirmed-screen">
        <div class="confirmed-icon locked">🔒</div>
        <h2 class="locked">Already Submitted</h2>
        <p>You've already locked in your predictions for this gameweek. Good luck — results will be emailed after all matches are played.</p>
      </div>`;
  }

  function lockDuplicateMatches(matchIds) {
    if (!window.predictedMatchIds) {
      window.predictedMatchIds = new Set();
    }

    matchIds.forEach(matchId => {
      const id = String(matchId);
      window.predictedMatchIds.add(id);

      const card = document.querySelector(`[data-match-id="${id}"]`);
      if (!card) return;

      card.classList.add('locked');
      card.querySelectorAll('.score-input').forEach(input => {
        input.disabled = true;
      });

      if (!card.querySelector('.locked-label')) {
        const recentForm = card.querySelector('.recent-form');
        const label = document.createElement('div');
        label.className = 'locked-label';
        label.textContent = '🔒 Already predicted';
        card.insertBefore(label, recentForm);
      }
    });

    updateProgress();
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
